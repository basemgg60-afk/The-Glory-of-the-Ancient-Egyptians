<!DOCTYPE html>
<html dir="ltr" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر أكواد متكامل - مع صور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2f;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            direction: ltr;
        }

        .toolbar {
            background: #2d2d44;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 2px solid #4a4a6a;
        }

        .toolbar h2 {
            font-size: 20px;
            color: #61dafb;
        }

        .toolbar h2 i {
            margin-right: 10px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .actions button {
            background: #4a4a6a;
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .actions button:hover {
            background: #61dafb;
            color: #1e1e2f;
            transform: scale(1.05);
        }

        .actions button.download {
            background: #28a745;
        }

        .actions button.download:hover {
            background: #34ce57;
        }

        .actions button.download-html {
            background: #007bff;
        }

        .actions button.download-html:hover {
            background: #3395ff;
        }

        .actions button.upload-images {
            background: #ff6b6b;
        }

        .actions button.upload-images:hover {
            background: #ff8787;
        }

        .save-status {
            color: #aaa;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .save-status.saved {
            color: #28a745;
        }

        .save-status.saving {
            color: #ffc107;
        }

        .editor-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 0;
        }

        .editor-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
            min-width: 300px;
        }

        .editor-tabs {
            display: flex;
            background: #2d2d44;
            border-bottom: 1px solid #4a4a6a;
        }

        .editor-tabs button {
            background: transparent;
            border: none;
            color: #aaa;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 3px solid transparent;
            transition: 0.3s;
            font-weight: bold;
        }

        .editor-tabs button.active {
            color: #61dafb;
            border-bottom-color: #61dafb;
            background: #1a1a2e;
        }

        .editor-tabs button:hover {
            color: #fff;
        }

        .editor-textarea {
            flex: 1;
            background: #0d0d1a;
            color: #d4d4d4;
            border: none;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            resize: none;
            outline: none;
            line-height: 1.6;
            tab-size: 4;
            direction: ltr;
            text-align: left;
        }

        .editor-textarea::selection {
            background: #61dafb33;
        }

        .preview-section {
            flex: 1;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            border-left: 3px solid #4a4a6a;
            min-width: 300px;
        }

        .preview-header {
            background: #2d2d44;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #4a4a6a;
        }

        .preview-header span {
            color: #aaa;
            font-size: 14px;
        }

        .preview-header i {
            color: #61dafb;
        }

        .preview-frame {
            flex: 1;
            border: none;
            background: #fff;
            width: 100%;
        }

        .image-list {
            background: #2d2d44;
            padding: 8px 15px;
            border-top: 1px solid #4a4a6a;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            max-height: 80px;
            overflow-y: auto;
        }

        .image-list .image-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #1a1a2e;
            padding: 3px 10px 3px 5px;
            border-radius: 4px;
            font-size: 12px;
        }

        .image-list .image-item img {
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 4px;
        }

        .image-list .image-item .remove-img {
            cursor: pointer;
            color: #ff6b6b;
            font-size: 14px;
            margin-left: 3px;
        }

        .image-list .image-item .remove-img:hover {
            color: #ff0000;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #28a745;
            color: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            z-index: 9999;
            font-size: 16px;
            direction: ltr;
        }

        .toast.error {
            background: #dc3545;
        }

        @media (max-width: 768px) {
            .editor-container {
                flex-direction: column;
            }
            .preview-section {
                border-left: none;
                border-top: 3px solid #4a4a6a;
                min-height: 400px;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .actions {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <h2><i class="fas fa-code"></i> محرر الأكواد</h2>
        <div class="actions">
            <button onclick="runCode()"><i class="fas fa-play"></i> تشغيل</button>
            <button onclick="uploadImages()" class="upload-images"><i class="fas fa-images"></i> رفع صور</button>
            <button onclick="downloadProject()" class="download"><i class="fas fa-download"></i> تحميل المشروع (ZIP)</button>
            <button onclick="downloadHTML()" class="download-html"><i class="fas fa-file-code"></i> تحميل HTML</button>
            <button onclick="clearAll()"><i class="fas fa-trash"></i> مسح الكل</button>
        </div>
        <div class="save-status" id="saveStatus">
            <i class="fas fa-check-circle"></i>
            <span>تم الحفظ</span>
        </div>
    </div>

    <div class="editor-container">
        <div class="editor-section">
            <div class="editor-tabs">
                <button class="active" data-lang="html" onclick="switchTab('html')"><i class="fab fa-html5"></i> HTML</button>
                <button data-lang="css" onclick="switchTab('css')"><i class="fab fa-css3-alt"></i> CSS</button>
                <button data-lang="js" onclick="switchTab('js')"><i class="fab fa-js"></i> JavaScript</button>
            </div>
            <textarea id="codeEditor" class="editor-textarea" spellcheck="false" dir="ltr"></textarea>
        </div>

        <div class="preview-section">
            <div class="preview-header">
                <span><i class="fas fa-eye"></i> المعاينة المباشرة</span>
                <span><i class="fas fa-image"></i> الصور: <span id="imageCount">0</span></span>
            </div>
            <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
            <div class="image-list" id="imageList">
                <span style="color: #888; font-size: 12px;">📸 الصور المرفوعة</span>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const STORAGE_KEY = 'code_editor_data';
        const IMAGES_KEY = 'code_editor_images';
        
        const defaultCode = {
            html: `<!DOCTYPE html>
        <html dir="ltr">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>صفحتي</title>
            <style>
                /* CSS سيكتب هنا تلقائياً */
            </style>
        </head>
        <body>
            <h1>مرحباً بك في المحرر!</h1>
            <p>اكتب أكوادك في اليسار وشاهد المعاينة في اليمين</p>
            <p>📸 لاستدعاء صورة: <code>&lt;img src="اسم_الصورة.jpg"&gt;</code></p>
            <button onclick="alert('تم الضغط!')">اضغط هنا</button>
        </body>
        </html>`,
            css: `body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        img {
            max-width: 300px;
            border-radius: 10px;
            margin: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        button {
            padding: 12px 30px;
            background: #fff;
            color: #764ba2;
            border: none;
            border-radius: 30px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }`,
            js: `// أكتب كود JavaScript هنا
        console.log("المحرر يعمل!");
        document.querySelector('h1')?.addEventListener('click', function() {
            this.style.color = '#ffd700';
        });`
        };

        let currentLang = 'html';
        const editor = document.getElementById('codeEditor');
        const preview = document.getElementById('previewFrame');
        const saveStatus = document.getElementById('saveStatus');
        const imageList = document.getElementById('imageList');
        const imageCount = document.getElementById('imageCount');
        let saveTimeout = null;
        let isSaving = false;
        let uploadedImages = {};

        // ===================== تحميل الصور من التخزين =====================
        function loadImagesFromStorage() {
            try {
                const saved = localStorage.getItem(IMAGES_KEY);
                if (saved) {
                    uploadedImages = JSON.parse(saved);
                    updateImageList();
                    return true;
                }
            } catch (e) {
                console.warn('فشل تحميل الصور:', e);
            }
            return false;
        }

        function saveImagesToStorage() {
            try {
                localStorage.setItem(IMAGES_KEY, JSON.stringify(uploadedImages));
            } catch (e) {
                console.warn('فشل حفظ الصور:', e);
            }
        }

        function updateImageList() {
            const filenames = Object.keys(uploadedImages);
            imageCount.textContent = filenames.length;
            
            imageList.innerHTML = '<span style="color: #888; font-size: 12px;">📸 الصور المرفوعة</span>';
            
            if (filenames.length === 0) {
                const emptyMsg = document.createElement('span');
                emptyMsg.style.cssText = 'color: #666; font-size: 12px; margin-left: 10px;';
                emptyMsg.textContent = '(لا توجد صور)';
                imageList.appendChild(emptyMsg);
                return;
            }
            
            filenames.forEach(filename => {
                const item = document.createElement('div');
                item.className = 'image-item';
                item.innerHTML = `
                    <img src="${uploadedImages[filename]}" alt="${filename}">
                    <span>${filename}</span>
                    <span class="remove-img" onclick="removeImage('${filename}')"><i class="fas fa-times"></i></span>
                `;
                imageList.appendChild(item);
            });
        }

        function removeImage(filename) {
            if (confirm(`هل تريد حذف الصورة "${filename}"؟`)) {
                delete uploadedImages[filename];
                saveImagesToStorage();
                updateImageList();
                runCode();
                showToast(`🗑️ تم حذف ${filename}`);
            }
        }

        function uploadImages() {
            const input = document.createElement('input');
            input.type = 'file';
            input.multiple = true;
            input.accept = 'image/*';
            input.onchange = function(e) {
                const files = e.target.files;
                let loaded = 0;
                for (const file of files) {
                    if (file.size > 5 * 1024 * 1024) {
                        showToast(`⚠️ ${file.name} كبير جداً (حد أقصى 5MB)`, 'error');
                        continue;
                    }
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const filename = file.name;
                        uploadedImages[filename] = ev.target.result;
                        loaded++;
                        if (loaded === files.length) {
                            saveImagesToStorage();
                            updateImageList();
                            runCode();
                            showToast(`✅ تم رفع ${loaded} صورة/صور`);
                        }
                    };
                    reader.readAsDataURL(file);
                }
                if (files.length === 0) {
                    showToast('⚠️ لم يتم اختيار أي صورة', 'error');
                }
            };
            input.click();
        }

        // ===================== الحفظ التلقائي =====================
        function saveToLocalStorage() {
            defaultCode[currentLang] = editor.value;
            const data = {
                html: defaultCode.html,
                css: defaultCode.css,
                js: defaultCode.js,
                currentLang: currentLang,
                timestamp: Date.now()
            };
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                updateSaveStatus(true);
            } catch (e) {
                console.warn('فشل الحفظ:', e);
            }
        }

        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.html) defaultCode.html = data.html;
                    if (data.css) defaultCode.css = data.css;
                    if (data.js) defaultCode.js = data.js;
                    if (data.currentLang) currentLang = data.currentLang;
                    return true;
                }
            } catch (e) {
                console.warn('فشل تحميل البيانات:', e);
            }
            return false;
        }

        function updateSaveStatus(saved = true) {
            saveStatus.className = 'save-status' + (saved ? ' saved' : ' saving');
            if (saved) {
                saveStatus.innerHTML = '<i class="fas fa-check-circle"></i><span>تم الحفظ</span>';
            } else {
                saveStatus.innerHTML = '<i class="fas fa-spinner fa-pulse"></i><span>جاري الحفظ...</span>';
            }
        }

        // ===================== التحميل الافتراضي =====================
        function loadDefault() {
            loadImagesFromStorage();
            const hasSaved = loadFromLocalStorage();
            if (hasSaved) {
                document.querySelectorAll('.editor-tabs button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === currentLang);
                });
                editor.value = defaultCode[currentLang];
            } else {
                editor.value = defaultCode.html;
            }
            runCode();
            updateSaveStatus(true);
        }

        // ===================== التبديل بين اللغات =====================
        function switchTab(lang) {
            defaultCode[currentLang] = editor.value;
            document.querySelectorAll('.editor-tabs button').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-lang="${lang}"]`).classList.add('active');
            currentLang = lang;
            editor.value = defaultCode[lang] || '// اكتب كودك هنا';
            saveToLocalStorage();
        }

        // ===================== تشغيل الكود =====================
        function runCode() {
            defaultCode[currentLang] = editor.value;
            const html = defaultCode.html;
            const css = defaultCode.css;
            const js = defaultCode.js;

            // استبدال مسارات الصور بـ Data URIs في المعاينة
            let processedHtml = html;
            const imageNames = Object.keys(uploadedImages);
            imageNames.forEach(name => {
                const regex = new RegExp(`src=["']${name}["']`, 'g');
                processedHtml = processedHtml.replace(regex, `src="${uploadedImages[name]}"`);
            });

            const fullDoc = processedHtml.replace(
                /<\/head>/,
                `<style>${css}</style></head>`
            ).replace(
                /<\/body>/,
                `<script>${js}<\/script></body>`
            );

            preview.srcdoc = fullDoc;
            showToast('✅ تم تشغيل الكود بنجاح!');
        }

        // ===================== تحميل HTML مع الصور =====================
        function downloadHTML() {
            defaultCode[currentLang] = editor.value;
            
            let html = defaultCode.html;
            const css = defaultCode.css;
            const js = defaultCode.js;

            // استبدال مسارات الصور بـ Data URIs في ملف HTML
            const imageNames = Object.keys(uploadedImages);
            imageNames.forEach(name => {
                const regex = new RegExp(`src=["']${name}["']`, 'g');
                html = html.replace(regex, `src="${uploadedImages[name]}"`);
            });

            const fullDoc = html.replace(
                /<\/head>/,
                `<style>${css}</style></head>`
            ).replace(
                /<\/body>/,
                `<script>${js}<\/script></body>`
            );

            const blob = new Blob([fullDoc], { type: 'text/html;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'صفحتي.html';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            showToast('✅ تم تحميل صفحة HTML مع الصور!');
        }

        // ===================== تحميل المشروع (ZIP) =====================
        function downloadProject() {
            defaultCode[currentLang] = editor.value;

            if (typeof JSZip === 'undefined') {
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
                script.onload = () => createProjectZip();
                document.head.appendChild(script);
                showToast('⏳ جاري تحميل المكتبة...');
            } else {
                createProjectZip();
            }
        }

        function createProjectZip() {
            const zip = new JSZip();
            
            // إضافة ملفات المشروع
            zip.file('index.html', defaultCode.html);
            zip.file('style.css', defaultCode.css);
            zip.file('script.js', defaultCode.js);

            // إضافة الصور في مجلد منفصل
            const imageNames = Object.keys(uploadedImages);
            if (imageNames.length > 0) {
                const imgFolder = zip.folder('images');
                imageNames.forEach(name => {
                    // تحويل Data URI إلى Blob
                    const dataUrl = uploadedImages[name];
                    const byteString = atob(dataUrl.split(',')[1]);
                    const mimeType = dataUrl.split(',')[0].split(':')[1].split(';')[0];
                    const ab = new ArrayBuffer(byteString.length);
                    const ia = new Uint8Array(ab);
                    for (let i = 0; i < byteString.length; i++) {
                        ia[i] = byteString.charCodeAt(i);
                    }
                    const blob = new Blob([ab], { type: mimeType });
                    imgFolder.file(name, blob);
                });
            }

            zip.generateAsync({ type: 'blob' }).then((blob) => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'مشروعي.zip';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
                showToast('✅ تم تحميل المشروع مع الصور!');
            });
        }

        // ===================== مسح الكل =====================
        function clearAll() {
            if (confirm('هل أنت متأكد من مسح كل الأكواد والصور؟')) {
                defaultCode.html = '';
                defaultCode.css = '';
                defaultCode.js = '';
                uploadedImages = {};
                editor.value = '';
                saveImagesToStorage();
                saveToLocalStorage();
                updateImageList();
                preview.srcdoc = '<h1 style="color:#333;text-align:center;margin-top:50px;">🔄 تم المسح</h1>';
                showToast('🗑️ تم مسح كل الأكواد والصور');
            }
        }

        // ===================== إظهار الرسائل =====================
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast' + (type === 'error' ? ' error' : '');
            toast.style.display = 'block';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // ===================== اختصارات لوحة المفاتيح =====================
        editor.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            }
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveToLocalStorage();
                showToast('💾 تم الحفظ!');
            }
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 4;
            }
        });

        editor.addEventListener('input', () => {
            if (!isSaving) {
                isSaving = true;
                updateSaveStatus(false);
            }
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveToLocalStorage();
                isSaving = false;
            }, 500);
        });

        window.addEventListener('beforeunload', () => {
            saveToLocalStorage();
            saveImagesToStorage();
        });

        // ===================== بدء التشغيل =====================
        loadDefault();

        if (typeof JSZip === 'undefined') {
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
            document.head.appendChild(script);
        }

        console.log('🚀 محرر الأكواد جاهز!');
        console.log('📌 استخدم Ctrl+Enter للتشغيل السريع');
        console.log('💾 استخدم Ctrl+S للحفظ اليدوي');
        console.log('📸 ارفع صور ثم استدعها في الكود');
    </script>

</body>
</html>
